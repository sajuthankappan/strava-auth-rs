[package]
name = "strava-auth"
version = "0.6.1"
authors = ["Saju Thankappan <sajuthankappan@gmail.com>"]
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Strava auth api bindings"
homepage = "https://github.com/sajuthankappan/strava-auth-rs"
repository = "https://github.com/sajuthankappan/strava-auth-rs"
readme = "README.md"
keywords = ["strava"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
strava-data = "0.6.0"

[dev-dependencies]
dotenvy = "0.15"
env_logger = "0.11"
tokio = { version = "1", features = ["macros", "rt"] }